# English -> Amharic configuration.
#
# IMPORTANT — vocab size is NOT uniform across the three tokenizer
# conditions in this language pair. This is intentional (see
# tokenizers/movoc_tok/README.md and README.md "Known caveats" #2/#3):
#
#   bpe        -> vocab_size 32000   (Amharic-trained)
#   wordpiece  -> vocab_size 32000   (Amharic-trained)
#   movoc_tok  -> vocab_size 63051   (HF export; native 63050) -- REUSED from
#                 the Tigrinya-trained MoVoC-Tok tokenizer (same artifact as
#                 en_ti's movoc_tok). No Amharic-trained 63k MoVoC-Tok
#                 exists. A 32k Amharic-only MoVoC-Tok variant exists
#                 (movoc_tok_32k_amharic) but was explicitly rejected to
#                 keep the MoVoC-Tok vocab size uniform with en_ti (63051)
#                 instead of uniform with the other en_am tokenizers
#                 (32000). Expect elevated fertility / UNK rate on Amharic
#                 for this tokenizer -- scripts/verify_tokenizers.py
#                 measures and reports this but does not fail the pipeline
#                 because of it.

language_pair: en_am
source_lang: en
target_lang: am

# See en_ti.yaml comment on how/when this is resolved.
base_model_identifier: Helsinki-NLP/opus-mt-en-am

opus:
  corpus: NLLB
  # Confirmed HTTP 200 at spec-authoring time. Note the source/target order
  # in the OPUS object key is "am-en", not "en-am" -- this is a naming
  # asymmetry in the OPUS object store, not an error; prepare_opus_data.py
  # handles this explicitly and documents which moses file is source vs
  # target.
  url: https://object.pouta.csc.fi/OPUS-NLLB/v1/moses/am-en.txt.zip
  moses_source_suffix: en
  moses_target_suffix: am

tokenizers:
  bpe:
    path: /homes/neumann/teklehaymanot/amseg/tokenizers/hf/bpe_32k
    vocab_size: 32000
  wordpiece:
    path: /homes/neumann/teklehaymanot/amseg/tokenizers/hf/wordpiece_32k
    vocab_size: 32000
  movoc_tok:
    path: /homes/neumann/teklehaymanot/amseg/tokenizers/hf/movoc_tok_63050_tigrinya
    vocab_size: 63051  # HF export size; native 63050. REUSED Tigrinya tokenizer.
    cross_lingual_reuse: true
    warning: "This tokenizer was trained exclusively on Tigrinya text and is being applied out-of-domain to Amharic per explicit user decision; expect elevated fertility/UNK rate."

reference_tokenizer:
  path: /homes/neumann/teklehaymanot/amseg/tokenizers/hf/marian_original
  vocab_size: 63050
